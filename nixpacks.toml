# Nixpacks deployment configuration for Dokploy
[variables]
BUILD_CACHE_BUSTER = "v5.0.0-AI-REBUILD-SEP20"
NIXPACKS_NO_CACHE = "1"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
