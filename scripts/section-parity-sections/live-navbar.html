<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,600;0,700;1,400&family=Open+Sans:wght@700;800&display=swap');

  .penn-header {
    width: 100%;
    background: transparent;
    position: relative;
    z-index: 9999;
    box-sizing: border-box;
  }

  .penn-header *,
  .penn-header *::before,
  .penn-header *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .penn-container {
    width: 100%;
    max-width: 3840px;
    margin: 0 auto;
    padding: clamp(0.75rem, 1.2vw, 1.5rem) clamp(1rem, 3.5vw, 4rem);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: clamp(1rem, 2vw, 2.5rem);
  }

  /* Logo */
  .penn-brand {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    color: #ffffff;
    gap: clamp(0.6rem, 1vw, 1rem);
    flex-shrink: 0;
  }

  .penn-shield {
    width: clamp(38px, 4vw, 56px);
    height: auto;
  }

  .penn-text {
    display: flex;
    flex-direction: column;
    line-height: 0.9;
  }

  .penn-title {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: clamp(2.3rem, 3.4vw, 4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
  }

  .penn-subtitle {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: clamp(0.72rem, 0.95vw, 1.05rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 3px;
    color: #ffffff;
  }

  .penn-subtitle em {
    font-style: italic;
    text-transform: lowercase;
    font-size: 1.1em;
    margin-right: 2px;
  }

  /* Navigation Structure */
  .penn-nav-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  /* Upper Tier */
  .penn-top-tier {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: clamp(1rem, 1.8vw, 2.2rem);
  }

  .penn-top-line {
    height: 1px;
    background-color: rgba(255, 255, 255, 0.4);
    flex: 1;
    margin-right: clamp(0.8rem, 1.5vw, 1.8rem);
  }

  .penn-search {
    background: transparent;
    border: none;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.25rem;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .penn-search:hover {
    transform: scale(1.1);
    opacity: 0.85;
  }

  .penn-search svg {
    width: clamp(18px, 1.35vw, 24px);
    height: clamp(18px, 1.35vw, 24px);
  }

  .penn-resources {
    background: transparent;
    border: none;
    color: #ffffff;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(0.75rem, 0.88vw, 1rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }

  .penn-resources:hover {
    opacity: 0.8;
  }

  .penn-give-btn {
    background-color: #990000;
    color: #ffffff;
    text-decoration: none;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(0.75rem, 0.88vw, 1rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: clamp(0.65rem, 0.95vw, 1.1rem) clamp(1.2rem, 1.8vw, 2.4rem);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: background-color 0.2s ease;
  }

  .penn-give-btn:hover {
    background-color: #b30000;
  }

  /* Bottom Tier */
  .penn-main-nav {
    margin-top: clamp(0.45rem, 0.85vw, 0.95rem);
    display: flex;
    justify-content: flex-end;
  }

  .penn-menu-list {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    list-style: none;
    flex-wrap: wrap;
    gap: clamp(0.4rem, 0.75vw, 1.15rem);
  }

  .penn-menu-item {
    display: inline-flex;
    align-items: center;
  }

  .penn-link {
    color: #ffffff;
    text-decoration: none;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: clamp(0.76rem, 0.9vw, 1.05rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    white-space: nowrap;
    transition: opacity 0.2s ease;
  }

  .penn-link:hover {
    opacity: 0.8;
  }

  .penn-chevron {
    width: clamp(9px, 0.7vw, 13px);
    height: clamp(9px, 0.7vw, 13px);
  }

  .penn-slash {
    color: rgba(255, 255, 255, 0.4);
    font-family: 'Open Sans', sans-serif;
    font-size: clamp(0.75rem, 0.9vw, 1rem);
    user-select: none;
    margin: 0 0.15rem;
  }

  .penn-burger {
    display: none;
    background: none;
    border: none;
    color: #ffffff;
    cursor: pointer;
    padding: 0.5rem;
  }

  .penn-burger svg {
    width: 30px;
    height: 30px;
  }

  /* Responsive Rules */
  @media (max-width: 1024px) {
    .penn-top-line {
      display: none;
    }

    .penn-burger {
      display: block;
    }

    .penn-nav-wrap {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: rgba(1, 31, 91, 0.97);
      backdrop-filter: blur(10px);
      padding: 1.5rem clamp(1rem, 3.5vw, 4rem) 2.5rem;
    }

    .penn-nav-wrap.open {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .penn-top-tier {
      justify-content: space-between;
      flex-direction: row-reverse;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 1.2rem;
    }

    .penn-main-nav {
      margin-top: 0;
    }

    .penn-menu-list {
      flex-direction: column;
      align-items: flex-start;
      gap: 1.25rem;
    }

    .penn-slash {
      display: none;
    }

    .penn-link {
      font-size: 1.1rem;
    }
  }

  @media (max-width: 480px) {
    .penn-container {
      padding: 0.75rem 1rem;
    }
    
    .penn-subtitle {
      letter-spacing: 0.03em;
    }
  }
</style>

      <nav class="penn-main-nav" aria-label="Primary Navigation">

              <svg class="penn-chevron" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">

          <li class="penn-menu-item">

              <svg class="penn-chevron" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">

          <li class="penn-slash">/</li>

              <svg class="penn-chevron" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">

</header>
