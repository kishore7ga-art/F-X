<section style="background: #f8fafc; color: #0f172a; padding: 72px 32px;">
  <form style="max-width: 720px; margin: 0 auto; display: grid; gap: 18px;">
    <h2 style="font-size: 32px; font-weight: 800; margin: 0;">Admissions enquiry</h2>
    <label style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #475569;">Full name</label>
    <input type="text" placeholder="Your name" style="padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff;" />
    <label style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #475569;">Programme</label>
    <select style="padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff;">
      <option>Undergraduate</option>
      <option>Postgraduate</option>
    </select>
    <textarea rows="4" placeholder="Your question" style="padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff;"></textarea>
    <button type="button" style="padding: 15px 28px; border: none; border-radius: 999px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;">Send enquiry</button>
  </form>
</section>
