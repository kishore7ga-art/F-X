<!DOCTYPE html>
<html>
<head>
  <title>Footer</title>
  <style>
    html, body { background: #090d16; color: #e2e8f0; font-family: Georgia, "Times New Roman", serif; }
    .foot { padding: 56px 32px 32px; }
    .foot-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; }
    .foot h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.14em; margin: 0 0 14px; color: #94a3b8; }
    .foot ul { list-style: none; margin: 0; padding: 0; }
    .foot li { margin-bottom: 9px; }
    .foot a { color: #e2e8f0; text-decoration: none; font-size: 15px; }
    .foot-bottom { max-width: 1200px; margin: 36px auto 0; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 20px; font-size: 13px; color: #64748b; }
  </style>
</head>
<body>
  <footer class="foot">
    <div class="foot-grid">
      <div><h4>The College</h4><p style="font-size: 15px; line-height: 1.7; margin: 0;">Hanover, New Hampshire 03755</p></div>
      <div><h4>Study</h4><ul><li><a href="#">Undergraduate</a></li><li><a href="#">Graduate</a></li></ul></div>
      <div><h4>Visit</h4><ul><li><a href="#">Tours</a></li><li><a href="#">Maps</a></li></ul></div>
      <div><h4>Connect</h4><ul><li><a href="#">News</a></li><li><a href="#">Alumni</a></li></ul></div>
    </div>
    <div class="foot-bottom">&copy; 2026 The College. All rights reserved.</div>
  </footer>
</body>
</html>
