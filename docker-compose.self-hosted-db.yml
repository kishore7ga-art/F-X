# Optional override: run Postgres as a container instead of using a managed
# cloud database.
#
#   docker compose -f docker-compose.yml -f docker-compose.self-hosted-db.yml up
#
# Trade-off vs. a cloud provider: no managed backups, no failover, and the data
# lives on this one server's disk. Fine for a staging box, risky for production
# unless you set up your own backups of the `db_data` volume.

services:
  app:
    depends_on:
      db:
        # Postgres accepts connections a few seconds after the container starts;
        # without this the first boot races the migration step.
        condition: service_healthy
    environment:
      # Overrides the cloud URL from the base file. `db` is the service name on
      # the Docker network; no TLS needed inside it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Deliberately not published to the host — only `app` needs it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
