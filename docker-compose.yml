# Default deployment: the app connects to a MANAGED CLOUD POSTGRES.
#
# There is one service here, not three. This project is a single full-stack
# Next.js app (Server Components, Server Actions, route handlers) so there is no
# separate backend process, and the database is hosted by a provider rather than
# run as a container.
#
# Set DATABASE_URL in Dokploy -> Application -> Environment to your provider's
# connection string. See .env.example.
#
# To run Postgres as a container instead (self-hosted, you own backups), deploy
# with the override file:
#   docker compose -f docker-compose.yml -f docker-compose.self-hosted-db.yml up
#
# WARNING: do not point a deployed app at `localhost` — inside a container that
# resolves to the container itself, not your machine.

services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Full connection string from your cloud provider, including
      # `?sslmode=require`. TLS is negotiated automatically for non-local hosts.
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      # Keep the pool under the provider's connection limit.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
    volumes:
      # Uploaded section images are written to disk. Without this volume they
      # disappear on every redeploy.
      - uploads:/app/public/uploads

volumes:
  uploads:
