# Self-contained stack: the app plus its own Postgres. Boots with no external
# database account — set SESSION_SECRET and POSTGRES_PASSWORD and it runs.
#
# This project is a single full-stack Next.js app (Server Components, Server
# Actions, route handlers), so there is no separate backend service.
#
# Already have a managed cloud database? Use the app-only file instead:
#   docker compose -f docker-compose.cloud-db.yml up
# On Dokploy, set the Compose file path to docker-compose.cloud-db.yml.

services:
  app:
    build:
      context: .
      # Build-time, because Next inlines NEXT_PUBLIC_* into the client bundle.
      # A runtime environment entry alone reaches the server and never the
      # browser. Changing it requires a rebuild, not a restart.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    restart: unless-stopped
    # NOT published to the host. Dokploy's own dashboard occupies host port
    # 3000, so `ports: - "3000:3000"` fails with "port is already allocated"
    # and Traefik is left with no backend (502). Traefik reaches the container
    # over the Docker network instead — set the port to 3000 in Dokploy's
    # Domains tab.
    #
    # To publish it locally for testing:
    #   docker compose run --service-ports app
    expose:
      - "3000"
    depends_on:
      db:
        # Postgres accepts connections a few seconds after the container
        # starts; without this the first boot races the migration step.
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Built from the values below. Setting DATABASE_URL in the host
      # environment overrides this and points the app at an external database.
      DATABASE_URL: ${DATABASE_URL:-postgresql://collegeadmin:${POSTGRES_PASSWORD}@db:5432/college_saas?schema=public}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL_NO_VERIFY: ${DATABASE_SSL_NO_VERIFY:-false}
      # Not used to connect directly. It lets scripts/start.mjs rebuild the
      # line above when DATABASE_URL was set to an unfilled template
      # placeholder, which would otherwise override this default with a
      # hostname that cannot resolve.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Everything .env.example documents has to be named here or it never
      # reaches the container: compose uses the host environment to interpolate
      # ${...} and then passes on only what this block lists. A variable set in
      # a dashboard and silently dropped is worse than one that was never
      # offered, because it looks like the feature is broken.
      MIGRATE_RETRIES: ${MIGRATE_RETRIES:-5}
      MIGRATE_FAIL_FAST: ${MIGRATE_FAIL_FAST:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Named here or compose drops them: variables set in a dashboard are used
      # for ${...} interpolation and then discarded unless listed.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-}
      OPEN_ACCESS_SUBDOMAIN: ${OPEN_ACCESS_SUBDOMAIN:-main}
      OPEN_ACCESS_COLLEGE_NAME: ${OPEN_ACCESS_COLLEGE_NAME:-My College}
    volumes:
      # Uploaded section images are written to disk. Without this volume they
      # disappear on every redeploy.
      - uploads:/app/public/uploads

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Deliberately not published to the host — only `app` needs it.
    environment:
      POSTGRES_USER: collegeadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: college_saas
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collegeadmin -d college_saas"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  uploads:
